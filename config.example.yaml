# Example prui config — copy to ~/.config/prui/config.yaml

hosts:
  - name: github
    kind: github
    base_url: https://github.com
    api_url: https://api.github.com/
    token_env: GITHUB_TOKEN

  - name: work-ghe
    kind: github
    base_url: https://ghe.example.com
    api_url: https://ghe.example.com/api/v3
    # Prefer cookie auth when the company does not issue PATs:
    cookie_env: GHE_COOKIE
    # token_env: GHE_TOKEN
    # ca_cert: /etc/ssl/certs/corp-ca.pem

  - name: bitbucket
    kind: bitbucket_cloud
    base_url: https://bitbucket.org
    api_url: https://api.bitbucket.org/2.0
    token_env: BITBUCKET_TOKEN
    username: yourname

  - name: work-bb
    kind: bitbucket_dc
    base_url: https://bitbucket.example.com
    api_url: https://bitbucket.example.com/rest/api/1.0
    cookie_env: BB_COOKIE
    # SSH clone host often differs from the web/API host — map it explicitly:
    match_hosts:
      - git-ssh.example.com
    # token_env: BB_TOKEN
    # username: yourname

defaults:
  host: work-bb

ui:
  diff: unified   # unified | split
  files: selected # selected | all
  theme: dark

# Optional: AI summarize (key S). Selection is config-only.
# For Copilot on GHE while reviewing Bitbucket, only api_url is required — then:
#   prui auth login --hostname ghe.example.com
ai:
  default: copilot-ghe
  max_context_bytes: 120000
  timeout_sec: 120
  providers:
    claude:
      kind: claude
      model: claude-sonnet-4-5
      token_env: ANTHROPIC_API_KEY
    copilot-ghe:
      kind: copilot
      model: gpt-4.1
      api_url: https://ghe.example.com/api/v3
      # optional native device flow (otherwise `prui auth login` wraps gh):
      # oauth_client_id: Iv1.xxxxx
    copilot:
      kind: copilot
      model: gpt-4.1
    codex:
      kind: codex
      model: ""
    opencode:
      kind: opencode
      model: ""
