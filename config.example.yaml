# Example prui config — copy to ~/.config/prui/config.yaml
#
# GitHub/GHE: prefer `prui auth login --hostname …` (no token_env needed).
# Bitbucket DC: cookie_env is still common when PATs are unavailable.

hosts:
  - name: github
    kind: github
    base_url: https://github.com
    api_url: https://api.github.com/

  - name: ghe
    kind: github
    base_url: https://ghe.example.com
    api_url: https://ghe.example.com/api/v3
    # match_hosts:
    #   - git.ghe.example.com
    # ca_cert: /etc/ssl/certs/corp-ca.pem
    # Optional overrides (usually skip — use prui auth login):
    # token_env: GHE_TOKEN
    # cookie_env: GHE_COOKIE

  - name: bitbucket
    kind: bitbucket_cloud
    base_url: https://bitbucket.org
    api_url: https://api.bitbucket.org/2.0
    token_env: BITBUCKET_TOKEN
    username: yourname

  - name: bitbucket-dc
    kind: bitbucket_dc
    base_url: https://bitbucket.example.com
    api_url: https://bitbucket.example.com/rest/api/1.0
    cookie_env: BB_COOKIE
    match_hosts:
      - git.bitbucket.example.com

defaults:
  host: github

ui:
  diff: unified   # unified | split
  files: selected # selected | all
  theme: dark

# AI summarize (key S). Selection is config-only (`ai.default`).
ai:
  default: claude
  max_context_bytes: 120000
  timeout_sec: 120
  providers:
    claude:
      kind: claude
      model: claude-sonnet-4-5
      token_env: ANTHROPIC_API_KEY
    copilot:
      kind: copilot
      model: gpt-4o
      # For GitHub Enterprise Copilot:
      # api_url: https://ghe.example.com/api/v3
      # github_host: ghe
      # oauth_client_id: Iv1.xxxxx  # native device flow without gh
    codex:
      kind: codex
      model: ""
      # binary: codex
    opencode:
      kind: opencode
      model: ""
      # binary: opencode
