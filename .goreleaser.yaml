version: 2

project_name: prui

before:
  hooks:
    - go mod tidy

builds:
  - id: prui
    main: ./cmd/prui
    binary: prui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lum1n/prui/internal/version.Version={{.Version}}
      - -X github.com/lum1n/prui/internal/version.Commit={{.Commit}}
      - -X github.com/lum1n/prui/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
